<!DOCTYPE html>
<html>
  <head>
    <meta
      charset="utf-8"
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Hello wasm-pack!</title>
  </head>
  <link rel="stylesheet" href="./assets/mystyle.css" />
  <body>
    <noscript
      >This page contains webassembly and javascript content, please enable
      javascript in your browser.</noscript
    >
    <div class="alert"></div>
    <legend><h1>Config of the programme</h1></legend>
    <form id="parameter-form" action="/param_form" , method="POST">
      <p>File</p>
      <input type="submit" name="upload" />
      <p>
        <label for="element-symbol"><h2>Element Symbol</h2></label>
        <input type="text" name="element_symbol" required="true" />
      </p>
      <p>
        <label for="target_bondlength">
          <h2>Enter target bondlength</h2>
        </label>
        <input type="text" name="target_bondlength" required />
      </p>
      <p>
        <label for="x-range">
          <h2>Enter range of x-axis to search (in fractional coordinate)</h2>
        </label>
        <input type="text" name="x_min" value="0.0" /> -
        <input type="text" name="x_max" value="1.0" />
      </p>
      <p>
        <label for="y-range">
          <h2>Enter range of y-axis to search (in fractional coordinate)</h2>
        </label>
        <input type="text" name="y_min" value="0.0" /> -
        <input type="text" name="y_max" value="1.0" />
      </p>
      <p>
        <label for="z-range">
          <h2>Enter range of z-axis to search (in fractional coordinate)</h2>
        </label>
        <input type="text" name="z_min" value="0.0" /> -
        <input type="text" name="z_max" value="1.0" />
      </p>
      <p>
        <button type="submit" id="submit">Submit</button>
      </p>
    </form>
  </body>
  <!-- <script type="module" src="./bootstrap.js"></script> -->
</html>
